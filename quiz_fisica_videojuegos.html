<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quiz — Física aplicada a videojuegos</title>
<style>
:root{--bg:#101522;--panel:#171e2e;--card:#20293c;--text:#f4f7fb;--muted:#aeb8ca;--accent:#7dd3fc;--good:#4ade80;--bad:#fb7185;--border:#344158}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(135deg,#0b1020,#17213a);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;min-height:100vh;padding:24px}
.wrap{max-width:820px;margin:auto}
header{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:18px}
h1{font-size:clamp(22px,4vw,34px);margin:0}.muted{color:var(--muted)}
.progress{height:9px;background:#29344b;border-radius:99px;overflow:hidden;margin:12px 0 22px}.bar{height:100%;background:var(--accent);width:10%;transition:.25s}
.card{background:rgba(23,30,46,.96);border:1px solid var(--border);border-radius:20px;padding:clamp(18px,4vw,30px);box-shadow:0 16px 45px rgba(0,0,0,.2)}
.tag{display:inline-block;padding:6px 10px;border:1px solid var(--border);border-radius:99px;color:var(--accent);font-size:13px;margin-bottom:12px}
.question{font-size:clamp(20px,3.5vw,28px);line-height:1.3;margin:0 0 22px}
.answers{display:grid;gap:12px}.answer{width:100%;border:1px solid var(--border);background:var(--card);color:var(--text);padding:15px 17px;border-radius:13px;text-align:left;font-size:16px;cursor:pointer;transition:.15s}
.answer:hover{border-color:var(--accent);transform:translateY(-1px)}.answer:disabled{cursor:default;transform:none}.answer.correct{border-color:var(--good);background:rgba(74,222,128,.12)}.answer.wrong{border-color:var(--bad);background:rgba(251,113,133,.12)}
.feedback{margin-top:18px;padding:14px 16px;border-radius:13px;background:#111827;border:1px solid var(--border);line-height:1.45}
.actions{display:flex;justify-content:flex-end;margin-top:18px}.next,.restart{border:0;background:var(--accent);color:#07111b;font-weight:750;padding:12px 18px;border-radius:12px;cursor:pointer;font-size:16px}
.result{text-align:center}.scoreBig{font-size:64px;font-weight:800;margin:10px 0}.hidden{display:none}
footer{text-align:center;color:var(--muted);font-size:13px;margin-top:18px}
@media(max-width:520px){body{padding:14px}header{align-items:flex-start;flex-direction:column}.answer{font-size:15px}}
</style>
</head>
<body>
<div class="wrap">
<header><div><h1>Física aplicada a videojuegos</h1><div class="muted">MRU · MRUV · Caída libre · Tiro vertical · Colisiones</div></div><div><span class="muted">Puntaje: </span><strong id="score">0</strong></div></header>
<div class="progress"><div id="bar" class="bar"></div></div>
<main id="quiz" class="card">
<div class="muted" id="progressText"></div>
<div class="tag" id="topic"></div>
<h2 class="question" id="question"></h2>
<div class="answers" id="answers"></div>
<div id="feedback" class="feedback hidden" aria-live="polite"></div>
<div class="actions"><button id="next" class="next hidden">Siguiente →</button></div>
</main>
<section id="result" class="card result hidden">
<div class="muted">Resultado final</div><div class="scoreBig" id="finalScore"></div><p id="finalText"></p>
<button id="restart" class="restart">Volver a intentar</button>
</section>
<footer>Actividad de repaso — Física aplicada a videojuegos</footer>
</div>
<script>
const qs=[
{t:"MRU",q:"En un juego de carreras, un auto avanza por una pista recta manteniendo siempre la misma velocidad. ¿Qué tipo de movimiento representa?",a:["MRUV","MRU","Caída libre","Tiro vertical"],c:1,e:"Es MRU: la trayectoria es recta y la velocidad permanece constante."},
{t:"MRUV",q:"Un enemigo se desplaza en línea recta y su velocidad aumenta de manera constante con el tiempo. ¿Qué movimiento describe mejor su comportamiento?",a:["MRU","MRUV","Movimiento circular","Movimiento sin aceleración"],c:1,e:"Es MRUV: se mueve en línea recta con aceleración constante."},
{t:"Tiro vertical",q:"En un platformer, el personaje salta verticalmente hacia arriba. ¿Qué ocurre con su velocidad mientras asciende?",a:["Aumenta constantemente","Se mantiene igual","Disminuye hasta llegar a cero","Cambia de dirección inmediatamente"],c:2,e:"Durante el ascenso, su velocidad disminuye hasta llegar a cero en el punto más alto."},
{t:"Caída libre",q:"Un objeto se suelta desde una plataforma del escenario y comienza a caer. ¿Qué provoca su aceleración hacia abajo?",a:["La fricción","La gravedad","La colisión","La velocidad inicial"],c:1,e:"En el modelo de caída libre, la aceleración hacia abajo se debe a la gravedad."},
{t:"Aceleración",q:"En un juego, una caja avanza en línea recta sin aumentar ni disminuir su velocidad. ¿Qué ocurre con su aceleración?",a:["Es positiva","Es negativa","Es cero","Aumenta con el tiempo"],c:2,e:"Si la velocidad no cambia, la aceleración es cero."},
{t:"MRUV",q:"Un personaje pisa un speed boost y comienza a aumentar progresivamente su velocidad mientras avanza en línea recta. ¿Qué cambió en su movimiento?",a:["Apareció una aceleración","Dejó de tener velocidad","Su posición dejó de cambiar","Entró en caída libre"],c:0,e:"Apareció una aceleración: la velocidad está cambiando con el tiempo."},
{t:"Colisiones · AABB",q:"En un juego 2D, el sistema comprueba si los límites de dos cajas rectangulares se superponen. ¿Qué método de detección está usando?",a:["Colisión entre círculos","AABB","Tiro vertical","MRU"],c:1,e:"AABB comprueba la superposición de los límites de cajas rectangulares."},
{t:"Colisiones · Círculos",q:"Dos bolas de un videojuego se consideran en colisión al comparar la distancia entre sus centros con la suma de sus radios. ¿Qué método se está utilizando?",a:["AABB","Colisión círculo-círculo","MRUV","Malla triangular"],c:1,e:"Es una detección de colisión círculo-círculo; en 3D, el equivalente es esfera-esfera."},
{t:"Colisiones",q:"¿Para qué sirve la detección de colisiones dentro de un videojuego?",a:["Para cambiar la resolución de pantalla","Para gestionar interacciones entre personajes, objetos y entorno","Para aumentar automáticamente los FPS","Para cambiar la música"],c:1,e:"Permite gestionar interacciones entre personajes, objetos y el entorno."},
{t:"Tiro vertical",q:"Un personaje salta, alcanza el punto más alto de su trayectoria y luego comienza a caer. ¿Qué ocurre con su velocidad justo en el punto más alto?",a:["Es máxima","Es cero","Es igual a la velocidad inicial","Permanece constante durante todo el salto"],c:1,e:"En el punto más alto, la velocidad es momentáneamente cero antes de comenzar la caída."}
];
let i=0,score=0,locked=false;
const $=id=>document.getElementById(id);
function render(){
 locked=false;$("feedback").classList.add("hidden");$("next").classList.add("hidden");
 const x=qs[i];$("progressText").textContent=`Pregunta ${i+1} de ${qs.length}`;$("topic").textContent=x.t;$("question").textContent=x.q;
 $("bar").style.width=`${(i+1)/qs.length*100}%`;$("answers").innerHTML="";
 x.a.forEach((txt,j)=>{const b=document.createElement("button");b.className="answer";b.innerHTML=`<strong>${String.fromCharCode(65+j)}.</strong> ${txt}`;b.onclick=()=>choose(j,b);$("answers").appendChild(b);});
}
function choose(j,b){
 if(locked)return;locked=true;const x=qs[i],bs=[...document.querySelectorAll(".answer")];bs.forEach(v=>v.disabled=true);
 if(j===x.c){score++;$("score").textContent=score;b.classList.add("correct");$("feedback").innerHTML="<strong>¡Correcto!</strong> "+x.e}
 else{b.classList.add("wrong");bs[x.c].classList.add("correct");$("feedback").innerHTML="<strong>Incorrecto.</strong> "+x.e}
 $("feedback").classList.remove("hidden");$("next").classList.remove("hidden");
}
$("next").onclick=()=>{i++;if(i<qs.length)render();else finish()};
function finish(){
 $("quiz").classList.add("hidden");$("result").classList.remove("hidden");$("bar").style.width="100%";$("finalScore").textContent=`${score} / ${qs.length}`;
 $("finalText").textContent=score===10?"¡Excelente! Dominás los conceptos del tema.":score>=7?"Muy bien. Tenés una buena comprensión de los conceptos.":score>=5?"Buen comienzo. Conviene repasar algunos conceptos.":"Conviene repasar los conceptos y volver a intentarlo.";
}
$("restart").onclick=()=>{i=0;score=0;$("score").textContent="0";$("result").classList.add("hidden");$("quiz").classList.remove("hidden");render()};
render();
</script>
</body>
</html>
